/* tokens.css */
/* ======================================================================
   بوصلة الباحث — Design Tokens
   لوحة أكاديمية هادئة: Ivory / Navy / Teal مع لمسة نحاسية محدودة.
   ====================================================================== */

:root {
  /* --- Surfaces --- */
  --ivory: #f7f4ed;
  --ivory-deep: #efeade;
  --paper: #ffffff;
  --paper-tint: #fbfaf7;

  /* --- Ink --- */
  --navy: #12263f;
  --navy-soft: #2c425e;
  --ink-muted: #5d6b7e;
  --ink-faint: #8a94a1;

  /* --- Functional --- */
  --teal: #0f766e;
  --teal-deep: #0b5a54;
  --teal-tint: #e6f1ef;
  --brass: #a8813f;
  --brass-tint: #f5eede;

  /* --- Semantic feedback (never colour alone) --- */
  --ok: #0f766e;
  --ok-tint: #e6f1ef;
  --warn: #8a5a12;
  --warn-tint: #f8f0de;
  --stop: #9b2c2c;
  --stop-tint: #fbeaea;

  /* --- Lines & shadows --- */
  --line: #e4ddcf;
  --line-strong: #d3c9b6;
  --shadow-sm: 0 1px 2px rgba(18, 38, 63, 0.05);
  --shadow-md: 0 6px 20px -12px rgba(18, 38, 63, 0.28);
  --shadow-lg: 0 18px 44px -28px rgba(18, 38, 63, 0.35);

  /* --- Radii --- */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;

  /* --- Type --- */
  --font: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs-display: clamp(2.25rem, 1.4rem + 3.6vw, 3.75rem);
  --fs-h1: clamp(1.8rem, 1.3rem + 2vw, 2.6rem);
  --fs-h2: clamp(1.35rem, 1.1rem + 1.1vw, 1.8rem);
  --fs-h3: 1.18rem;
  --fs-body: 1.02rem;
  --fs-sm: 0.92rem;
  --fs-xs: 0.82rem;

  /* --- Spacing --- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;

  /* --- Layout --- */
  --page: 1120px;
  --page-narrow: 760px;
  --header-h: 68px;

  /* --- Motion --- */
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  --dur: 220ms;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur: 1ms;
  }
}

/* base.css */
/* ======================================================================
   Base — reset مختصر، تايبوغرافيا عربية، حالات التركيز
   ====================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

body {
  margin: 0;
  background: var(--ivory);
  color: var(--navy);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.75;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  line-height: 1.35;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.2px;
}

h1 {
  font-size: var(--fs-h1);
}
h2 {
  font-size: var(--fs-h2);
}
h3 {
  font-size: var(--fs-h3);
}

p {
  margin: 0 0 var(--s-4);
  max-width: 68ch;
}

ul,
ol {
  margin: 0;
  padding-inline-start: 1.3em;
}

a {
  color: var(--teal-deep);
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}

button {
  font: inherit;
  color: inherit;
}

img,
svg {
  max-width: 100%;
}

:focus-visible {
  outline: 3px solid var(--brass);
  outline-offset: 3px;
  border-radius: 4px;
}

::selection {
  background: var(--teal-tint);
  color: var(--navy);
}

/* رقم لاتيني داخل نص عربي يبقى بترتيب صحيح */
.ltr {
  direction: ltr;
  unicode-bidi: isolate;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  inset-inline-start: var(--s-4);
  top: -100px;
  z-index: 100;
  background: var(--navy);
  color: var(--ivory);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-sm);
  transition: top var(--dur) var(--ease);
}

.skip-link:focus {
  top: var(--s-3);
}

/* --- Layout helpers --- */
.page {
  width: min(100% - 2 * var(--s-5), var(--page));
  margin-inline: auto;
}

.page-narrow {
  width: min(100% - 2 * var(--s-5), var(--page-narrow));
  margin-inline: auto;
}

.section {
  padding-block: var(--s-8);
}

.section-tight {
  padding-block: var(--s-7);
}

.stack > * + * {
  margin-top: var(--s-4);
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
}

/* components.css */
/* ======================================================================
   Components — عناصر واجهة مشتركة
   ====================================================================== */

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: 12px 22px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: transparent;
  font-size: var(--fs-sm);
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
    color var(--dur) var(--ease), transform var(--dur) var(--ease);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--navy);
  color: var(--ivory);
}
.btn--primary:hover:not(:disabled) {
  background: #0c1c30;
}

.btn--accent {
  background: var(--teal);
  color: #fff;
}
.btn--accent:hover:not(:disabled) {
  background: var(--teal-deep);
}

.btn--outline {
  border-color: var(--line-strong);
  color: var(--navy);
  background: var(--paper);
}
.btn--outline:hover:not(:disabled) {
  border-color: var(--navy-soft);
}

.btn--ghost {
  color: var(--navy-soft);
  padding-inline: 12px;
}
.btn--ghost:hover:not(:disabled) {
  color: var(--navy);
  background: var(--ivory-deep);
}

.btn--sm {
  padding: 8px 14px;
  font-size: var(--fs-xs);
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-3);
}

/* ---------- Card ---------- */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s-5);
  box-shadow: var(--shadow-sm);
}

.card--flat {
  box-shadow: none;
}

.card--quiet {
  background: var(--paper-tint);
}

.card__title {
  font-size: var(--fs-h3);
  margin-bottom: var(--s-2);
}

.card__meta {
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}

/* ---------- Badge / chip ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: 500;
  line-height: 1.6;
}

.badge--teal {
  background: var(--teal-tint);
  color: var(--teal-deep);
}
.badge--brass {
  background: var(--brass-tint);
  color: var(--brass);
}
.badge--quiet {
  background: var(--ivory-deep);
  color: var(--ink-muted);
}

/* ---------- Eyebrow / section head ---------- */
.section-head {
  margin-bottom: var(--s-6);
}

.section-head__kicker {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  color: var(--brass);
  font-size: var(--fs-xs);
  font-weight: 500;
  margin-bottom: var(--s-2);
}

.section-head__kicker::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line-strong);
}

.section-head p {
  color: var(--ink-muted);
  margin-bottom: 0;
}

/* ---------- Option (single / multiple choice) ---------- */
.option-list {
  display: grid;
  gap: var(--s-3);
}

.option {
  display: flex;
  align-items: flex-start;
  gap: var(--s-3);
  width: 100%;
  text-align: start;
  padding: 14px 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  line-height: 1.6;
}

.option:hover:not(:disabled) {
  border-color: var(--teal);
}

.option__marker {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  margin-top: 3px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: grid;
  place-items: center;
  font-size: 11px;
  color: transparent;
  transition: all var(--dur) var(--ease);
}

.option[aria-pressed='true'],
.option[aria-checked='true'] {
  border-color: var(--teal);
  background: var(--teal-tint);
}

.option[aria-pressed='true'] .option__marker,
.option[aria-checked='true'] .option__marker {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.option--correct {
  border-color: var(--ok);
  background: var(--ok-tint);
}
.option--wrong {
  border-color: var(--stop);
  background: var(--stop-tint);
}

.option__body {
  flex: 1;
}

.option__label {
  font-weight: 500;
}

.option__hint {
  display: block;
  font-size: var(--fs-xs);
  color: var(--ink-muted);
  margin-top: 2px;
}

.option__state {
  font-size: var(--fs-xs);
  font-weight: 600;
  flex: 0 0 auto;
  margin-top: 3px;
}

.option--correct .option__state {
  color: var(--ok);
}
.option--wrong .option__state {
  color: var(--stop);
}

/* ---------- Feedback ---------- */
.feedback {
  display: flex;
  gap: var(--s-3);
  padding: var(--s-4);
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--paper-tint);
  font-size: var(--fs-sm);
  line-height: 1.7;
}

.feedback__icon {
  flex: 0 0 auto;
  font-weight: 700;
  font-size: var(--fs-sm);
}

.feedback p:last-child {
  margin-bottom: 0;
}

.feedback--ok {
  border-color: #bcd9d4;
  background: var(--ok-tint);
}
.feedback--ok .feedback__icon {
  color: var(--ok);
}

.feedback--warn {
  border-color: #e6d3a6;
  background: var(--warn-tint);
}
.feedback--warn .feedback__icon {
  color: var(--warn);
}

.feedback--stop {
  border-color: #e8c3c3;
  background: var(--stop-tint);
}
.feedback--stop .feedback__icon {
  color: var(--stop);
}

.feedback__title {
  font-weight: 600;
  display: block;
  margin-bottom: 2px;
}

/* ---------- Progress ---------- */
.progress {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}

.progress__track {
  flex: 1;
  height: 4px;
  background: var(--ivory-deep);
  border-radius: var(--r-pill);
  overflow: hidden;
}

.progress__fill {
  display: block;
  height: 100%;
  background: var(--teal);
  border-radius: var(--r-pill);
  transition: width var(--dur) var(--ease);
}

.progress__label {
  font-size: var(--fs-xs);
  color: var(--ink-muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ---------- Callout ---------- */
.callout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s-3);
  padding: var(--s-4);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-md);
  background: var(--brass-tint);
  font-size: var(--fs-sm);
}

.callout__text {
  color: var(--navy-soft);
}

/* ---------- Disclaimer ---------- */
.disclaimer {
  display: flex;
  gap: var(--s-3);
  padding: var(--s-4);
  border-inline-start: 3px solid var(--brass);
  background: var(--paper-tint);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  line-height: 1.75;
}

.disclaimer p {
  margin: 0;
}

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(18, 38, 63, 0.42);
  display: grid;
  place-items: center;
  padding: var(--s-4);
  z-index: 60;
}

.modal {
  background: var(--paper);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  width: min(100%, 620px);
  max-height: 86vh;
  overflow-y: auto;
  padding: var(--s-6);
}

.modal__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-4);
  margin-bottom: var(--s-4);
}

.modal__close {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: var(--r-sm);
  width: 34px;
  height: 34px;
  cursor: pointer;
  line-height: 1;
  font-size: 1.1rem;
  color: var(--ink-muted);
}

.modal__close:hover {
  border-color: var(--navy-soft);
  color: var(--navy);
}

/* ---------- Tooltip (term with definition) ---------- */
.term {
  border-bottom: 1px dotted var(--brass);
  cursor: help;
  position: relative;
}

.term__bubble {
  position: absolute;
  bottom: calc(100% + 8px);
  inset-inline-start: 50%;
  transform: translateX(50%);
  background: var(--navy);
  color: var(--ivory);
  padding: 8px 12px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  line-height: 1.6;
  width: max-content;
  max-width: 260px;
  z-index: 20;
  box-shadow: var(--shadow-md);
}

/* ---------- Flow diagram (ظاهرة → جمع → وصف → نتائج) ---------- */
.flow {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: var(--s-2);
  list-style: none;
  padding: 0;
  margin: 0;
}

.flow__node {
  flex: 1 1 130px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s-3) var(--s-4);
  text-align: center;
  font-size: var(--fs-sm);
  font-weight: 500;
  position: relative;
  display: grid;
  place-items: center;
}

.flow__node::after {
  content: '←';
  position: absolute;
  inset-inline-start: -16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--brass);
  font-size: 0.95rem;
}

.flow__node:last-child::after {
  content: none;
}

@media (max-width: 620px) {
  .flow {
    flex-direction: column;
  }
  .flow__node::after {
    content: '↓';
    inset-inline-start: 50%;
    top: auto;
    bottom: -16px;
    transform: translateX(50%);
  }
}

/* ---------- Numbered steps (workflow) ---------- */
.steps {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: var(--s-2);
}

.steps__item {
  display: flex;
  gap: var(--s-3);
  align-items: baseline;
  padding: 10px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}

.steps__num {
  font-size: var(--fs-xs);
  color: var(--brass);
  font-variant-numeric: tabular-nums;
  flex: 0 0 22px;
}

.steps__text {
  font-size: var(--fs-sm);
  font-weight: 500;
}

.steps__note {
  display: block;
  font-weight: 400;
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}

/* ---------- Two-column lists (متى / متى لا) ---------- */
.split {
  display: grid;
  gap: var(--s-4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.list-marked {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: var(--s-2);
  font-size: var(--fs-sm);
}

.list-marked li {
  display: flex;
  gap: var(--s-2);
  line-height: 1.7;
}

.list-marked li::before {
  content: attr(data-mark);
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--teal);
}

.list-marked--stop li::before {
  color: var(--stop);
}

/* ---------- Grid ---------- */
.grid {
  display: grid;
  gap: var(--s-4);
}

.grid--2 {
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}

.grid--3 {
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

/* layout.css */
/* ======================================================================
   Layout — الترويسة والتذييل والـHero
   ====================================================================== */

/* ------------------------------ Header ------------------------------ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(247, 244, 237, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.site-header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  min-height: var(--header-h);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
  color: var(--navy);
  text-decoration: none;
}

.brand__text {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}

.brand__name {
  font-weight: 600;
  font-size: 1.05rem;
}

.brand__sub {
  font-size: 0.68rem;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
}

.site-nav ul {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  list-style: none;
  margin: 0;
  padding: 0;
}

.site-nav__link {
  display: inline-block;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  color: var(--navy-soft);
  font-size: var(--fs-sm);
  text-decoration: none;
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}

.site-nav__link:hover {
  color: var(--navy);
  background: var(--ivory-deep);
}

.site-nav__link.is-active {
  color: var(--teal-deep);
  background: var(--teal-tint);
  font-weight: 500;
}

.nav-toggle {
  display: none;
  width: 42px;
  height: 42px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--paper);
  font-size: 1.15rem;
  cursor: pointer;
}

@media (max-width: 900px) {
  .nav-toggle {
    display: grid;
    place-items: center;
  }

  .site-nav {
    position: absolute;
    inset-inline: 0;
    top: var(--header-h);
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    max-height: 0;
    overflow: hidden;
    transition: max-height var(--dur) var(--ease);
  }

  .site-nav--open {
    max-height: 420px;
  }

  .site-nav ul {
    flex-direction: column;
    align-items: stretch;
    padding: var(--s-3) var(--s-5) var(--s-5);
    gap: var(--s-1);
  }

  .site-nav__link {
    display: block;
    padding: 12px 14px;
    font-size: 1rem;
  }
}

/* -------------------------------- Hero ------------------------------- */
.hero {
  border-bottom: 1px solid var(--line);
  background:
    radial-gradient(120% 90% at 85% 0%, rgba(15, 118, 110, 0.07), transparent 60%),
    var(--ivory);
}

.hero__inner {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
  gap: var(--s-7);
  align-items: center;
  padding-block: clamp(var(--s-7), 6vw, var(--s-9));
}

.hero__eyebrow {
  color: var(--brass);
  font-size: var(--fs-sm);
  margin-bottom: var(--s-3);
}

.hero__title {
  font-size: var(--fs-display);
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: var(--s-3);
}

.hero__tagline {
  font-size: clamp(1.1rem, 0.9rem + 0.8vw, 1.45rem);
  color: var(--teal-deep);
  font-weight: 500;
  margin-bottom: var(--s-4);
  padding-inline-start: var(--s-4);
  border-inline-start: 2px solid var(--brass);
}

.hero__lead {
  color: var(--ink-muted);
  font-size: 1.06rem;
  margin-bottom: var(--s-6);
  max-width: 52ch;
}

.hero__dial-wrap {
  display: grid;
  justify-items: center;
  gap: var(--s-3);
  min-width: 0;
}

/*
 * البوصلة موزعة على شبكة 3×3 ثابتة النسب بدل التموضع داخل عرض العمود كله.
 * بهذه الطريقة تكون الكلمات الأربع على نصف قطر واحد بالضبط مهما تغيّر عرض الصفحة.
 */
.hero__dial {
  --dial-core: 260px;
  --dial-label: 78px;
  --dial-gap: 10px;
  display: grid;
  grid-template-columns: var(--dial-label) var(--dial-core) var(--dial-label);
  grid-template-rows: 48px var(--dial-core) 48px;
  gap: var(--dial-gap);
  align-items: center;
  justify-items: center;
  direction: ltr;
}

.hero__dial-ring {
  grid-column: 2;
  grid-row: 2;
  color: var(--navy);
  width: var(--dial-core);
  height: var(--dial-core);
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}

.hero__coord {
  width: var(--dial-label);
  min-height: 42px;
  display: inline-grid;
  place-items: center;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--ivory) 90%, white 10%);
  color: var(--ink-faint);
  font: inherit;
  font-size: var(--fs-xs);
  cursor: pointer;
  direction: rtl;
  transition:
    color 160ms ease,
    border-color 160ms ease,
    background-color 160ms ease,
    transform 160ms ease;
}

.hero__coord:hover,
.hero__coord:focus-visible,
.hero__coord.is-active {
  color: var(--teal-deep);
  border-color: color-mix(in srgb, var(--teal) 55%, var(--line));
  background: color-mix(in srgb, var(--teal-tint) 76%, white 24%);
  transform: translateY(-1px);
}

.hero__coord:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--teal) 24%, transparent);
  outline-offset: 3px;
}

.hero__coord--top {
  grid-column: 2;
  grid-row: 1;
}

.hero__coord--right {
  grid-column: 3;
  grid-row: 2;
}

.hero__coord--bottom {
  grid-column: 2;
  grid-row: 3;
}

.hero__coord--left {
  grid-column: 1;
  grid-row: 2;
}

.hero__dial-help {
  margin: 0;
  max-width: 36ch;
  color: var(--ink-faint);
  font-size: var(--fs-xs);
  text-align: center;
}

.compass-needle {
  transform-box: view-box;
  transform-origin: 32px 32px;
  transition: transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
}

@media (prefers-reduced-motion: reduce) {
  .compass-needle,
  .hero__coord {
    transition: none;
  }
}

@media (max-width: 900px) {
  .hero__inner {
    grid-template-columns: 1fr;
    gap: var(--s-6);
  }

  .hero__dial-wrap {
    order: -1;
  }

  .hero__dial {
    --dial-core: 190px;
    --dial-label: 68px;
    --dial-gap: 7px;
    grid-template-rows: 44px var(--dial-core) 44px;
  }

  .hero__dial-ring {
    width: var(--dial-core);
    height: var(--dial-core);
  }
}

@media (max-width: 430px) {
  .hero__dial {
    --dial-core: 160px;
    --dial-label: 62px;
    --dial-gap: 5px;
    grid-template-rows: 42px var(--dial-core) 42px;
  }

  .hero__coord {
    min-height: 40px;
    font-size: 0.78rem;
  }
}

/* ------------------------------- Footer ------------------------------ */
.site-footer {
  border-top: 1px solid var(--line);
  background: var(--ivory-deep);
  margin-top: var(--s-8);
}

.site-footer__inner {
  padding-block: var(--s-6);
  display: grid;
  gap: var(--s-4);
}

.site-footer__name {
  font-weight: 600;
  margin: 0;
}

.site-footer__tag {
  color: var(--ink-muted);
  font-size: var(--fs-sm);
  margin: 0;
}

.site-footer__links {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-4);
}

.site-footer__links a {
  color: var(--navy-soft);
  font-size: var(--fs-sm);
  text-decoration: none;
}

.site-footer__links a:hover {
  color: var(--teal-deep);
  text-decoration: underline;
}

.site-footer__note {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  border-top: 1px solid var(--line-strong);
  padding-top: var(--s-4);
}

/* pages.css */
/* ======================================================================
   Pages — أنماط خاصة بالصفحات
   ====================================================================== */

/* ------------------------------ الرئيسية ----------------------------- */
.journey {
  list-style: none;
  margin: 0;
  padding: 0;

}

.journey__item {

  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s-5);
  position: relative;
}

.journey__item::before {
  content: '';

  inset-block-start: 0;
  inset-inline-start: var(--s-5);
  width: 34px;
  height: 2px;
  background: var(--brass);
}

.journey__num {
  display: block;
  font-size: var(--fs-xs);
  color: var(--brass);

}

.journey__item h3 {
  margin-bottom: var(--s-2);
}

.journey__item p {
  color: var(--ink-muted);
  font-size: var(--fs-sm);
  margin: 0;
}

.home-more {
  margin-top: var(--s-5);
}

.closing-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s-5);
  background: var(--navy);
  color: var(--ivory);
  border-radius: var(--r-lg);
  padding: var(--s-6);
}

.closing-band h2 {
  color: var(--ivory);
  margin-bottom: var(--s-2);
}

.closing-band p {
  color: #c9d3df;
  margin: 0;
  font-size: var(--fs-sm);
  max-width: 56ch;
}

/* ------------------------------- المكتبة ----------------------------- */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  margin-bottom: var(--s-5);
}

.chip {

  border: 1px solid var(--line-strong);

  color: var(--navy-soft);
  font-size: var(--fs-sm);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}

.chip:hover {
  border-color: var(--teal);
}

.chip.is-active {
  background: var(--navy);

  color: var(--ivory);
}

.library-grid {
  align-items: stretch;
}

.lib-card {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);

  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s-5);
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow-sm);
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}

.lib-card--link:hover {
  border-color: var(--teal);
}

.lib-card--soon {
  background: var(--paper-tint);

}

.lib-card__top {

}

}

.lib-card__en {
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  margin: 0;
}

.lib-card__tag {
  color: var(--teal-deep);
  font-size: var(--fs-sm);
  margin: 0;
}

.lib-card__summary {
  color: var(--ink-muted);
  font-size: var(--fs-sm);
  margin: 0;

}

.lib-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  margin-top: var(--s-2);
  padding-top: var(--s-3);

}

.lib-card__link {
  color: var(--teal-deep);
  font-size: var(--fs-sm);

}

.lib-card__muted {

  font-size: var(--fs-xs);
}

.lib-card--compact .lib-card__tag {
  flex: 1;
}

.library-cta {
  margin-top: var(--s-7);
  padding: var(--s-5);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--brass-tint);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;

}

.library-cta p {
  margin: 0;

}

/* ------------------------------- البوصلة ----------------------------- */

  text-align: start;

.compass-intro__mark {

.compass-intro h1 {

.compass-intro > p {

.field {

}

.field__label {

}

.field__input {

.field__input:focus {

}

.field__help {

.compass-question__title {

.compass-question__help {

.compass-actions {

.result-why__lead {

.result-actions {

.result-note {

}

  text-decoration: underline;
}

.module__title {

}

.module__subtitle {

  margin-bottom: var(--s-4);
}

.module__nudge {
  font-size: var(--fs-xs);

  margin: var(--s-2) 0 0;
}

.module__body {
  padding: var(--s-6);
}

.module__step-title {

  margin-bottom: var(--s-4);

.module__step-title:focus {

}

}

.module__nav-meta {
  font-size: var(--fs-xs);

  text-align: center;
  flex: 1;

}

.module__done h2 {
  margin-bottom: var(--s-3);
}

.module__restart {

}

  .module__body {
    padding: var(--s-5) var(--s-4);
  }
  .module__nav-meta {
    display: none;

.scenario {

  padding: var(--s-4) var(--s-5);
  background: var(--paper-tint);
  border-inline-start: 3px solid var(--teal);
  border-radius: var(--r-sm);
  font-size: 1.04rem;
  line-height: 1.85;
}

.lead-text {
  font-size: 1.06rem;
  line-height: 1.9;
}

.note-line {

  color: var(--ink-muted);
  background: var(--brass-tint);
  border-radius: var(--r-sm);
  padding: var(--s-3) var(--s-4);

}

.q-forms {
  list-style: none;

}

}

.callout--inline {

  padding: var(--s-3);
  font-size: var(--fs-xs);
  display: flex;
}

.example-grid {

  border: 1px solid var(--line);

  overflow: hidden;
}

.example-grid__row {

  grid-template-columns: 140px 1fr;

}

.example-grid dt {
  background: var(--paper-tint);
  padding: var(--s-3) var(--s-4);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}

.example-grid dd {
  background: var(--paper);

  font-size: var(--fs-sm);
}

  .example-grid__row {
    grid-template-columns: 1fr;
  }

.case-row {

.case-card {

  padding: var(--s-4);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
  display: grid;

  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);

.case-card:hover {

}

.case-card.is-open {

.case-card__label {

}

.case-card__text {

  line-height: 1.7;

.pitfall {

  border-radius: var(--r-md);
  padding: var(--s-5);
  background: var(--paper-tint);
}

.pitfall__title {
  color: var(--warn);
  font-size: var(--fs-h3);
  margin-bottom: var(--s-3);
}

.pitfall__rule {
  font-weight: 600;
  margin-bottom: var(--s-3);
}

.pitfall__example {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  margin: 0;
}

.quiz-item {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s-5);
  background: var(--paper-tint);
  display: grid;
  gap: var(--s-3);
}

.quiz-item__index {
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  margin: 0;
}

.quiz-item__prompt {
  font-size: 1.05rem;
  margin: 0;
}

.quiz-score {
  padding: var(--s-4);
  border-radius: var(--r-md);
  background: var(--teal-tint);
  color: var(--teal-deep);
  font-size: var(--fs-sm);
  font-weight: 500;
}

/* --------------------------- بطاقة المنهجية -------------------------- */
.meth-card {
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--paper);
  margin: var(--s-5) 0;
}

.meth-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  background: var(--navy);
  color: var(--ivory);
}

.meth-card__head h3 {
  color: var(--ivory);
  margin: 0;
  font-size: 1.05rem;
}

.meth-card__stamp {
  color: var(--brass);
}

.meth-card__body {
  margin: 0;
}

.meth-card__row {
  display: grid;
  grid-template-columns: 130px 1fr;
  border-top: 1px solid var(--line);
}

.meth-card__row:first-child {
  border-top: none;
}

.meth-card__row dt {
  padding: var(--s-3) var(--s-4);
  background: var(--paper-tint);
  font-size: var(--fs-xs);
  color: var(--ink-muted);
}

.meth-card__row dd {
  padding: var(--s-3) var(--s-4);
  margin: 0;
  font-size: var(--fs-sm);
}

@media (max-width: 620px) {
  .meth-card__row {
    grid-template-columns: 1fr;
  }
  .meth-card__row dd {
    padding-top: 0;
  }
}

/* ------------------------------- المقارنة ---------------------------- */
.compare-pickers {
  display: grid;
  gap: var(--s-4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  margin-bottom: var(--s-5);
}

.picker {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s-4);
  background: var(--paper);
  margin: 0;
}

.picker legend {
  font-size: var(--fs-xs);
  color: var(--ink-muted);
  padding-inline: var(--s-2);
}

.picker .filter-row {
  margin-bottom: 0;
}

.compare-heads {
  display: grid;
  grid-template-columns: 120px 1fr 1fr;
  gap: var(--s-3);
  align-items: center;
  margin-bottom: var(--s-3);
}

.compare-heads__name {
  font-weight: 600;
  color: var(--navy);
  background: var(--ivory-deep);
  border-radius: var(--r-sm);
  padding: var(--s-2) var(--s-4);
  text-align: center;
}

.compare-heads__vs {
  font-size: var(--fs-xs);
  color: var(--brass);
  text-align: center;
}

.compare {
  margin: 0;
  display: grid;
  gap: var(--s-2);
}

.compare__row {
  display: grid;
  grid-template-columns: 120px 1fr 1fr;
  gap: var(--s-3);
  align-items: stretch;
}

.compare__label {
  display: flex;
  align-items: center;
  font-size: var(--fs-xs);
  color: var(--ink-muted);
  background: var(--paper-tint);
  border-radius: var(--r-sm);
  padding: var(--s-3);
}

.compare__cell {
  margin: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: var(--s-3) var(--s-4);
  font-size: var(--fs-sm);
  line-height: 1.7;
}

.compare__cell--alt {
  border-color: #cfe0dc;
  background: #fbfdfd;
}

.compare__cell-name {
  display: none;
  font-size: var(--fs-xs);
  color: var(--brass);
  margin-bottom: 4px;
}

@media (max-width: 760px) {
  .compare-heads {
    display: none;
  }
  .compare__row {
    grid-template-columns: 1fr;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: var(--s-3);
    background: var(--paper);
    gap: var(--s-2);
  }
  .compare__cell-name {
    display: block;
  }
  .compare__label {
    background: transparent;
    padding: 0;
    font-weight: 600;
    color: var(--navy);
    font-size: var(--fs-sm);
  }
}

.compare-key {
  margin-top: var(--s-6);
  padding: var(--s-5);
  border-radius: var(--r-md);
  background: var(--brass-tint);
  border: 1px solid var(--line-strong);
}

.compare-key h2 {
  font-size: var(--fs-h3);
  margin-bottom: var(--s-2);
}

.compare-key p {
  font-size: var(--fs-sm);
  color: var(--navy-soft);
}

/* ------------------------------ تحدي الباحث --------------------------- */
.challenge {
  display: grid;
  gap: var(--s-4);
}

.challenge__counter {
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  margin: 0;
}

.challenge__prompt {
  font-size: var(--fs-h3);
  margin: 0;
}

.challenge__hint {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  margin: 0;
}

.challenge__facts {
  display: grid;
  gap: var(--s-3);
  margin: 0;
  padding: var(--s-4);
  background: var(--paper-tint);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}

.challenge__facts dt {
  font-size: var(--fs-xs);
  color: var(--ink-faint);
}

.challenge__facts dd {
  margin: 2px 0 0;
  font-size: var(--fs-sm);
  font-weight: 500;
}

.challenge__takeaway {
  font-size: var(--fs-sm);
  color: var(--navy-soft);
  border-inline-start: 3px solid var(--brass);
  padding-inline-start: var(--s-4);
  margin: 0;
}

.challenge__tally {
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  margin: var(--s-4) 0 var(--s-5);
}

/* ----------------------------- حقيبة الباحث --------------------------- */
.kit-card {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  align-items: flex-start;
  padding: var(--s-5);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-md);
  background: var(--paper-tint);
}

.kit-card--ready {
  border-style: solid;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
}

.kit-card__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-3);
  width: 100%;
}

.kit-card__top h3 {
  font-size: 1.05rem;
}

.kit-card__summary {
  color: var(--ink-muted);
  font-size: var(--fs-sm);
  margin: 0;
  flex: 1;
}

.kit-card__muted {
  font-size: var(--fs-xs);
  color: var(--ink-faint);
}
